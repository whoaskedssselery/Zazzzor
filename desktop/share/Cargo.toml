[package]
name = "zazzzor-share"
version = "0.1.0"
edition = "2024"
publish = false
description = "Share a Windows screen or window and one app's sound to a Zazzzor call"

[dependencies]
anyhow = "=1.0.104"
livekit = "=0.10.0"
log = "=0.4.35"
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
# The #[implement] macro of `windows` names this crate directly.
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
] }

# The CLI in examples/share.
[dev-dependencies]
clap = { version = "=4.6.7", features = ["derive", "env"] }
env_logger = "=0.11.11"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["signal"] }
ureq = { version = "=3.5.1", features = ["json"] }

[profile.release]
debug = 1
