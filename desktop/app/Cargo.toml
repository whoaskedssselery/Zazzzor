[package]
name = "zazzzor-desktop"
version = "0.2.2"
edition = "2024"
publish = false
description = "Zazzzor for Windows: the instance's web client in its own window, with a tray icon"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls"] }
tauri-plugin-window-state = "=2.5.0"
url = "=2.5.8"
zazzzor-share = { path = "../share" }

# The same versions as Tauri's WebView2 runtime, for the permission handler.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = 1

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
