<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zazzzor</title>
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <main id="main" data-pending>
      <!-- The mark of the web client (web/src/shared/ui/components/Logo.tsx); same paths. -->
      <p class="brand" translate="no">
        <svg class="logo" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <g class="letter l0">
            <path class="shadow" d="M6 24H25L6 42H25" stroke-width="6.5" transform="translate(1.6 2)" />
            <path class="face" d="M6 24H25L6 42H25" stroke-width="6.5" />
          </g>
          <g class="letter l1">
            <path class="shadow" d="M29 14H38L29 23H38" stroke-width="4" transform="translate(1.1 1.4)" />
            <path class="face" d="M29 14H38L29 23H38" stroke-width="4" />
          </g>
          <g class="letter l2">
            <path class="shadow" d="M37 4H43L37 10H43" stroke-width="2.8" transform="translate(0.8 1)" />
            <path class="face" d="M37 4H43L37 10H43" stroke-width="2.8" />
          </g>
        </svg>
        Zazzzor
      </p>
      <h1 data-text="title">Where is your server?</h1>
      <p class="hint" data-text="hint">The address the server's owner gave you. The same one you open in a browser.</p>
      <form id="form" novalidate>
        <label for="url" data-text="label">Server address</label>
        <div class="field">
          <input
            id="url"
            name="url"
            type="url"
            inputmode="url"
            autocomplete="url"
            spellcheck="false"
            placeholder="https://zazzzor.example.org"
            required
            aria-describedby="error"
          />
          <button type="submit" id="submit" data-text="connect">Connect</button>
        </div>
        <p id="error" class="error" role="alert"></p>
        <button type="button" id="cancel" class="back" hidden data-text="back">Back to the current server</button>
      </form>
      <p class="later" data-text="later">You can change the server at any time: the Zazzzor tray icon's menu, “Change server…”.</p>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
