# Builds the server images and publishes them to GitHub Container Registry:
#   ghcr.io/<owner>/zazzzor-api    the API (server/Dockerfile)
#   ghcr.io/<owner>/zazzzor-caddy  Caddy with DuckDNS plus the static pages
#                                  (deploy/caddy/Dockerfile)
#
# Tags:
#   push to main  -> sha-<12 chars>, main, latest
#   tag v1.2.3    -> sha-<12 chars>, 1.2.3, 1.2
#   manual run    -> sha-<12 chars>
# Deploy by sha-<...> or a version tag: those never move, so Swarm sees every
# change and a rollback has a fixed target. latest/main are for convenience.
name: Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: zazzzor-api
            context: server
            dockerfile: server/Dockerfile
            title: Zazzzor API
          - image: zazzzor-caddy
            context: .
            dockerfile: deploy/caddy/Dockerfile
            title: Zazzzor Caddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lowercases the name, as GHCR requires.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
        env:
          # type=sha is 7 characters by default; 12 matches git rev-parse --short=12.
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The API prints it for `zazzzor --version` (the tag for releases,
          # the commit otherwise); Caddy ignores it.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ matrix.image }}
        run: |
          {
            echo "### $IMAGE"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
