# Builds the server images and publishes them to GitHub Container Registry:
#   ghcr.io/<owner>/zazzzor-api    the API (server/Dockerfile)
#   ghcr.io/<owner>/zazzzor-caddy  Caddy with DuckDNS plus the static pages
#                                  (deploy/caddy/Dockerfile)
#   ghcr.io/<owner>/zazzzor-backup Postgres with the backup job scripts
#                                  (deploy/backup/Dockerfile)
# and, when the repository variable DOCKERHUB_USERNAME and the secret
# DOCKERHUB_TOKEN are set, to Docker Hub under the same names and tags:
#   docker.io/<DOCKERHUB_USERNAME>/zazzzor-api, .../zazzzor-caddy,
#   .../zazzzor-backup
#
# Tags:
#   green CI on main -> sha-<12 chars>, main, latest
#   tag v1.2.3    -> sha-<12 chars>, 1.2.3, 1.2 (never latest)
#   manual run    -> sha-<12 chars>
# Deploy by sha-<...> or a full version: those never move, so Swarm sees every
# change and a rollback has a fixed target. 1.2 follows the newest 1.2.x;
# latest/main are for convenience.
name: Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for emergency publishing
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
    steps:
      - id: source
        name: Check CI and select the source commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              sha="$CI_SHA"
              ;;
            push)
              sha="$GITHUB_SHA"
              count="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f head_sha="$sha" -f branch=main -f event=push -f status=success -F per_page=1 --jq '.total_count')"
              if [[ "$count" == 0 ]]; then
                echo "::error::CI has not succeeded on main for tagged commit $sha."
                exit 1
              fi
              ;;
            workflow_dispatch)
              sha="$GITHUB_SHA"
              if [[ ! "$REASON" =~ [^[:space:]] ]]; then
                echo "::error::Enter a reason for emergency publishing."
                exit 1
              fi
              printf '### Emergency image publishing\n\n%s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit 1 ;;
          esac
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::The source commit SHA is missing or invalid.'
            exit 1
          fi
          printf 'sha=%s\nshort_sha=%s\n' "$sha" "${sha:0:12}" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    name: Publish ${{ matrix.image }}
    concurrency:
      group: images-${{ matrix.image }}-${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}
      cancel-in-progress: false
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: zazzzor-api
            context: server
            dockerfile: server/Dockerfile
            title: Zazzzor API
          - image: zazzzor-caddy
            context: .
            dockerfile: deploy/caddy/Dockerfile
            title: Zazzzor Caddy
          - image: zazzzor-backup
            context: deploy
            dockerfile: deploy/backup/Dockerfile
            title: Zazzzor backup job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      # The backup image is built on the Postgres the stack runs.
      - id: versions
        run: echo "postgres=$(grep -E '^POSTGRES_VERSION=' deploy/.env.example | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Layer cache. On GitHub's runners it is GitHub's cache service; a
      # self-hosted runner keeps it in a folder of its own, which it keeps
      # between jobs: the service is a download over a home link, and when it
      # did not answer the build failed.
      - id: cache
        env:
          IMAGE: ${{ matrix.image }}
          SELF_HOSTED: ${{ vars.CI_RUNNER != '' }}
        run: |
          if [ "$SELF_HOSTED" = true ]; then
            dir="$HOME/.cache/zazzzor-buildx/$IMAGE"
            {
              echo "from=type=local,src=$dir"
              echo "to=type=local,dest=$dir.new,mode=max"
              echo "dir=$dir"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "from=type=gha,scope=$IMAGE"
              echo "to=type=gha,mode=max,scope=$IMAGE"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: without DOCKERHUB_USERNAME only GHCR is used.
      - if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lowercases the name, as GHCR requires.
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME || 'unset' }}/${{ matrix.image }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          # latest follows main only: by default a semver tag would move it
          # to the tagged commit, which may be older than main.
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The API prints it for `zazzzor --version` (the tag for releases,
          # the commit otherwise); the others ignore it. Only the backup
          # image reads POSTGRES_VERSION.
          build-args: |
            VERSION=${{ github.event_name == 'push' && github.ref_name || needs.prepare.outputs.sha }}
            POSTGRES_VERSION=${{ steps.versions.outputs.postgres }}
          provenance: mode=max
          sbom: true
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}

      # A local cache is written whole to a new folder (the old one would only
      # grow); the new one replaces it.
      - if: steps.cache.outputs.dir != ''
        env:
          DIR: ${{ steps.cache.outputs.dir }}
        run: rm -rf "$DIR" && mv "$DIR.new" "$DIR"

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ matrix.image }}
        run: |
          {
            echo "### $IMAGE"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
