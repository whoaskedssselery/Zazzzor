name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tool versions; bump deliberately and keep local commands in sync.
  GOLANGCI_LINT_VERSION: v2.15.0
  REDOCLY_CLI_VERSION: 2.66.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  go:
    name: Go (vet, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy -diff
      - name: Verify sqlc output is current
        run: go tool sqlc diff
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server
      - name: go test (race; testcontainers use the runner's Docker)
        run: go test -race -count=1 ./...

  image:
    name: Server image (docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the image deploy/docker-compose.yml runs; nothing is pushed.
      - name: docker build server/Dockerfile
        run: docker build -f server/Dockerfile --build-arg VERSION="${GITHUB_SHA::12}" -t zazzzor-api:ci server
      - name: The binary runs in the image
        run: docker run --rm zazzzor-api:ci --version
      - name: Compose config is valid with the fake CI values
        run: docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml config --quiet
      # Renders deploy/docker-stack.yml the way stack.sh deploys it, and fails
      # if any ${...} is left unexpanded (docker stack interpolates less than
      # compose does).
      - name: Swarm stack config is valid with the fake CI values
        run: |
          out="$(ENV_FILE=deploy/.env.ci ZAZZZOR_API_TAG=ci ZAZZZOR_CADDY_TAG=ci bash deploy/scripts/stack.sh config)"
          if grep -n '\${' <<<"$out"; then
            echo "::error::unexpanded variables in the rendered stack"
            exit 1
          fi

  restore:
    name: Backups and restore (deploy/scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # In the Postgres image the backup service runs (busybox), as its UID:
      # as root every directory is writable and the permission checks pass.
      - name: Backup job (schedule, lock, health, retention, verify, restore)
        run: |
          image="postgres:$(grep -E '^POSTGRES_VERSION=' deploy/.env.ci | cut -d= -f2)"
          docker run --rm --user 65532:65532 -v "$PWD:/repo:ro" -w /repo "$image" \
            bash deploy/scripts/backup-job-test.sh
      # Also as 65532, the owner of the backup folder (require_backup_dir),
      # whose folder the test makes unreadable: the host side must never
      # look inside it, as on the server where it is 0700.
      - name: Restore orchestration with a fake docker
        run: |
          image="postgres:$(grep -E '^POSTGRES_VERSION=' deploy/.env.ci | cut -d= -f2)"
          docker run --rm --user 65532:65532 -v "$PWD:/repo:ro" -w /repo "$image" \
            bash deploy/scripts/backup-host-test.sh
      # Seeds data through the API, backs up, restores over a newer schema
      # and onto fresh volumes, and checks login, message and image bytes.
      - name: Restore end to end
        run: bash deploy/scripts/restore-test.sh

  web:
    name: Web packages (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match api/openapi.yaml
        run: |
          pnpm gen:api
          if ! git diff --exit-code -- web/src/api/schema.gen.ts; then
            echo "::error file=web/src/api/schema.gen.ts::stale; run 'pnpm gen:api' and commit the result"
            exit 1
          fi
      # Biome formats and lints every JS/TS package (biome.json at the root);
      # the version is the root devDependency from the lockfile.
      - name: Biome (format, lint, imports)
        run: pnpm exec biome ci --error-on-warnings .
      # Only packages with a "lint" script run: @zazzzor/web. The stage 1.1
      # connectivity-test has none on purpose (its type check runs in build).
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npx --yes "@redocly/cli@${REDOCLY_CLI_VERSION}" lint api/openapi.yaml

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'
