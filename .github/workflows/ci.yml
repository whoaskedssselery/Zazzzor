name: CI

on:
  # A branch with a pull request is checked once, by the pull_request run;
  # push runs only for main, whose green CI publishes the images.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tool versions; bump deliberately and keep local commands in sync.
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  REDOCLY_CLI_VERSION: 2.66.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  go:
    name: Go (vet, lint, test)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          # Self-hosted runners keep the module and build caches between
          # jobs; downloading GitHub's copy over a home link cost 1-2 minutes.
          cache: ${{ vars.CI_RUNNER == '' }}
          cache-dependency-path: server/go.sum
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy -diff
      - name: Verify sqlc output is current
        run: go tool sqlc diff
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server
      - name: go test (race; testcontainers use the runner's Docker)
        run: go test -race -count=1 ./...

  govulncheck:
    name: Go vulnerabilities (govulncheck)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          # Self-hosted runners keep the module and build caches between
          # jobs; downloading GitHub's copy over a home link cost 1-2 minutes.
          cache: ${{ vars.CI_RUNNER == '' }}
          cache-dependency-path: server/go.sum
      - name: Scan reachable vulnerabilities
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION" ./...

  image:
    name: Server image (docker build)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Also builds the web client and xcaddy on a cold runner (no cache).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the image deploy/docker-compose.yml runs; nothing is pushed.
      - name: docker build server/Dockerfile
        run: docker build -f server/Dockerfile --build-arg VERSION="${GITHUB_SHA::12}" -t zazzzor-api:ci server
      - name: The binary runs in the image
        run: docker run --rm zazzzor-api:ci --version
      - name: Compose config is valid with the fake CI values
        run: docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml config --quiet
      # Renders deploy/docker-stack.yml the way stack.sh deploys it, and fails
      # if any ${...} is left unexpanded (docker stack interpolates less than
      # compose does).
      - name: Swarm stack config is valid with the fake CI values
        run: |
          out="$(ENV_FILE=deploy/.env.ci ZAZZZOR_API_TAG=ci ZAZZZOR_CADDY_TAG=ci bash deploy/scripts/stack.sh config)"
          if grep -n '\${' <<<"$out"; then
            echo "::error::unexpanded variables in the rendered stack"
            exit 1
          fi
      - name: Swarm stacks, TURN, deploy guards and the README path (fake values)
        run: bash deploy/scripts/stack-test.sh
      - name: Build the static web image and test plain HTTP
        run: |
          docker build -f deploy/caddy/Dockerfile -t zazzzor-caddy:ci .
          docker run --rm --env-file deploy/.env.ci zazzzor-caddy:ci \
            caddy validate --config /etc/caddy/Caddyfile
          bash deploy/scripts/web-test.sh zazzzor-caddy:ci

  restore:
    name: Backups and restore (deploy/scripts)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # In the Postgres image the backup service runs (busybox), as its UID:
      # as root every directory is writable and the permission checks pass.
      - name: Backup job (schedule, lock, health, retention, verify, restore)
        run: |
          image="postgres:$(grep -E '^POSTGRES_VERSION=' deploy/.env.ci | cut -d= -f2)"
          docker run --rm --user 65532:65532 -v "$PWD:/repo:ro" -w /repo "$image" \
            bash deploy/scripts/backup-job-test.sh
      # Also as 65532, the owner of the backup folder (require_backup_dir),
      # whose folder the test makes unreadable: the host side must never
      # look inside it, as on the server where it is 0700.
      - name: Restore orchestration with a fake docker
        run: |
          image="postgres:$(grep -E '^POSTGRES_VERSION=' deploy/.env.ci | cut -d= -f2)"
          docker run --rm --user 65532:65532 -v "$PWD:/repo:ro" -w /repo "$image" \
            bash deploy/scripts/backup-host-test.sh
      # Seeds data through the API, backs up, restores over a newer schema
      # and onto fresh volumes, and checks login, message and image bytes.
      - name: Restore end to end
        run: bash deploy/scripts/restore-test.sh

  web:
    name: Web packages (lint, test, build)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Self-hosted runners keep the pnpm store between jobs.
          cache: ${{ vars.CI_RUNNER == '' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # New advisories show up here even when no dependency changed.
      - name: Known vulnerabilities in dependencies (pnpm audit)
        run: pnpm audit --audit-level moderate
      - name: Generated API types match api/openapi.yaml
        run: |
          pnpm gen:api
          if ! git diff --exit-code -- web/src/shared/api/schema.gen.ts; then
            echo "::error file=web/src/shared/api/schema.gen.ts::stale; run 'pnpm gen:api' and commit the result"
            exit 1
          fi
      # Biome formats and lints every JS/TS package (biome.json at the root);
      # the version is the root devDependency from the lockfile.
      - name: Biome (format, lint, imports)
        run: pnpm exec biome ci --error-on-warnings .
      # Only packages with a "lint" script run: @zazzzor/web. The stage 1.1
      # connectivity-test has none on purpose (its type check runs in build).
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build

  e2e:
    name: Browser tests (Chromium, Firefox)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Self-hosted runners keep the pnpm store between jobs.
          cache: ${{ vars.CI_RUNNER == '' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Playwright's Chromium and Firefox
        run: pnpm --filter @zazzzor/web exec playwright install --with-deps chromium firefox
      # The API image and Postgres of web/e2e/compose.yml, on loopback only.
      # e2e:up also opens registration in that throwaway database.
      - name: Start the e2e API
        run: pnpm --filter @zazzzor/web e2e:up
      # Builds the web client and serves it with `vite preview` under Caddy's CSP.
      - name: Every scenario in Chromium and Firefox
        run: pnpm --filter @zazzzor/web e2e
      - name: API logs
        if: failure()
        run: docker compose -f web/e2e/compose.yml logs api
      - name: Traces and screenshots of failed scenarios
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  openapi:
    name: OpenAPI lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npx --yes "@redocly/cli@${REDOCLY_CLI_VERSION}" lint api/openapi.yaml

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  desktop:
    name: Desktop client (Rust, Windows)
    # The native capture and encoding are Windows-only. The self-hosted
    # Windows runner keeps the build and the prebuilt libwebrtc between jobs
    # (CARGO_TARGET_DIR and LK_CUSTOM_WEBRTC in its own .env); GitHub's
    # runner downloads them each time.
    runs-on: ${{ vars.CI_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
        working-directory: desktop/capture-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put the user's Rust toolchain on PATH (self-hosted)
        run: |
          $cargo = Join-Path $env:USERPROFILE '.cargo\bin'
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue) -and (Test-Path $cargo)) {
            Add-Content -Path $env:GITHUB_PATH -Value $cargo
          }
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (warnings are errors)
        run: cargo clippy --release --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --release
