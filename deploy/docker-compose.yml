name: zazzzor

# Every service rotates its logs: at most 3 files of 10 MB each.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
      args:
        CADDY_VERSION: ${CADDY_VERSION:?заполните CADDY_VERSION в deploy/.env (см. deploy/.env.example)}
        DUCKDNS_PLUGIN_VERSION: ${DUCKDNS_PLUGIN_VERSION:?заполните DUCKDNS_PLUGIN_VERSION в deploy/.env (см. deploy/.env.example)}
    image: zazzzor-caddy:${CADDY_VERSION}-duckdns-${DUCKDNS_PLUGIN_VERSION}
    network_mode: host
    environment:
      ZAZZZOR_DOMAIN: ${ZAZZZOR_DOMAIN:?заполните ZAZZZOR_DOMAIN в deploy/.env - полное имя вида zazzzor.duckdns.org}
      ZAZZZOR_HTTPS_PORT: ${ZAZZZOR_HTTPS_PORT:?заполните ZAZZZOR_HTTPS_PORT в deploy/.env (обычно 443)}
      ACME_EMAIL: ${ACME_EMAIL:?заполните ACME_EMAIL в deploy/.env - ваша почта для Let's Encrypt}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?заполните DUCKDNS_TOKEN в deploy/.env - токен со страницы duckdns.org}
      ZAZZZOR_API_PORT: ${ZAZZZOR_API_PORT:-8080}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # Not on api: the connectivity page must come up even if the api build
    # fails or Postgres never gets healthy; until then /api/* answers 502.
    depends_on:
      - livekit
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:${LIVEKIT_VERSION:?заполните LIVEKIT_VERSION в deploy/.env (см. deploy/.env.example)}
    network_mode: host
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 127.0.0.1
        rtc:
          tcp_port: ${LIVEKIT_TCP_PORT:?заполните LIVEKIT_TCP_PORT в deploy/.env (обычно 7881)}
          udp_port: ${LIVEKIT_UDP_PORT:?заполните LIVEKIT_UDP_PORT в deploy/.env (обычно 7882)}
          # LiveKit 1.13 lets STUN override node_ip, so when LIVEKIT_NODE_IP is
          # set the next line turns into a YAML comment (use_external_ip: false).
          ${LIVEKIT_NODE_IP:+#}use_external_ip: true
          node_ip: ${LIVEKIT_NODE_IP:-}
          # Empty list = LiveKit's built-in STUN servers.
          stun_servers: [${LIVEKIT_STUN_SERVERS:-}]
        # Stage 1.1 measures direct UDP/TCP only. TURN/TLS on 443 is the
        # fallback, considered only if the test shows UDP blocked.
        turn:
          enabled: false
        keys:
          "${LIVEKIT_API_KEY:?заполните LIVEKIT_API_KEY в deploy/.env - результат openssl rand -hex 16}": "${LIVEKIT_API_SECRET:?заполните LIVEKIT_API_SECRET в deploy/.env - результат openssl rand -hex 32}"
        logging:
          level: info
    mem_limit: 1g
    logging: *logging
    restart: unless-stopped

  duckdns:
    image: lscr.io/linuxserver/duckdns:${DUCKDNS_IMAGE_VERSION:?заполните DUCKDNS_IMAGE_VERSION в deploy/.env (см. deploy/.env.example)}
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:?заполните DUCKDNS_SUBDOMAIN в deploy/.env - только поддомен, без .duckdns.org}
      TOKEN: ${DUCKDNS_TOKEN}
      UPDATE_IP: ipv4
      LOG_FILE: "false"
    mem_limit: 64m
    logging: *logging
    restart: unless-stopped

  postgres:
    image: postgres:${POSTGRES_VERSION:?заполните POSTGRES_VERSION в deploy/.env (см. deploy/.env.example)}
    environment:
      POSTGRES_USER: zazzzor
      POSTGRES_DB: zazzzor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?заполните POSTGRES_PASSWORD в deploy/.env - результат openssl rand -hex 24}
    # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/,
    # so the volume goes on the parent directory.
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - db
    # Over TCP, not the socket: during the first initialisation the image runs
    # a temporary server on the socket only, which must not count as ready.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "zazzzor", "-d", "zazzzor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    mem_limit: 1g
    logging: *logging
    restart: unless-stopped

  api:
    build:
      context: ../server
      args:
        VERSION: ${ZAZZZOR_VERSION:-dev}
    image: ${ZAZZZOR_API_IMAGE:-zazzzor-api:local}
    environment:
      # Hex password (see .env.example), so it needs no URL escaping.
      ZAZZZOR_DATABASE_URL: postgres://zazzzor:${POSTGRES_PASSWORD}@postgres:5432/zazzzor?sslmode=disable
      # Browsers omit :443 in Origin, so both forms are allowed: the bare
      # domain and the domain with the public port (ZAZZZOR_PUBLIC_PORT, else
      # ZAZZZOR_HTTPS_PORT). Smoke checks use the first one.
      ZAZZZOR_ALLOWED_ORIGINS: https://${ZAZZZOR_DOMAIN},https://${ZAZZZOR_DOMAIN}:${ZAZZZOR_PUBLIC_PORT:-${ZAZZZOR_HTTPS_PORT}}
      # Caddy (host network) reaches the published port through the gateway
      # of the api bridge network; default Docker bridges are in 172.16.0.0/12.
      # See deploy/README.md, «Сеть и адреса клиентов».
      ZAZZZOR_TRUSTED_PROXIES: ${ZAZZZOR_TRUSTED_PROXIES:-172.16.0.0/12,127.0.0.1/32}
      ZAZZZOR_ADMIN_USERNAMES: ${ZAZZZOR_ADMIN_USERNAMES:-}
      ZAZZZOR_DATA_DIR: /data
      # Empty takes the server default (config.DefaultFileRetention).
      ZAZZZOR_FILE_RETENTION: ${ZAZZZOR_FILE_RETENTION:-}
      # Below mem_limit, so the Go GC works harder before the kernel kills it.
      # The server caps its load-dependent allocations (image decodes, password
      # hashes, upload bodies) at 576 MiB in all; see the budget in
      # server/internal/platform/upload/upload.go.
      GOMEMLIMIT: 768MiB
    # Only on the host's loopback, for Caddy. The metrics port (9090) is not
    # published at all.
    ports:
      - "127.0.0.1:${ZAZZZOR_API_PORT:-8080}:8080"
    networks:
      - db
      - api
    volumes:
      - apidata:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/zazzzor", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # The server drains connections for up to 15 s on SIGTERM.
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    logging: *logging
    restart: unless-stopped

  # Daily backups (deploy/scripts/backup-job.sh schedule) in the Postgres
  # image, so pg_dump matches the server, as the API's UID. Turns unhealthy
  # when the newest backup is older than 26 h; see deploy/README.md.
  backup:
    image: postgres:${POSTGRES_VERSION:?заполните POSTGRES_VERSION в deploy/.env (см. deploy/.env.example)}
    user: "65532:65532"
    entrypoint: ["/bin/bash", "/opt/backup/backup-job.sh"]
    command: ["schedule"]
    environment:
      PGHOST: postgres
      PGUSER: zazzzor
      PGDATABASE: zazzzor
      PGPASSWORD: ${POSTGRES_PASSWORD:?заполните POSTGRES_PASSWORD в deploy/.env - результат openssl rand -hex 24}
      TZ: ${TZ:-Europe/Warsaw}
      # Empty values take the defaults of backup-job.sh.
      ZAZZZOR_BACKUP_TIME: ${ZAZZZOR_BACKUP_TIME:-}
      ZAZZZOR_BACKUP_KEEP_DAILY: ${ZAZZZOR_BACKUP_KEEP_DAILY:-}
      ZAZZZOR_BACKUP_KEEP_WEEKLY: ${ZAZZZOR_BACKUP_KEEP_WEEKLY:-}
      ZAZZZOR_APP_IMAGE: ${ZAZZZOR_API_IMAGE:-zazzzor-api:local}
      # The job names the host path in its errors.
      BACKUP_HOST_DIR: ${ZAZZZOR_BACKUP_DIR:?заполните ZAZZZOR_BACKUP_DIR в deploy/.env - каталог копий на хосте}
    volumes:
      - apidata:/data:ro
      - ./scripts:/opt/backup:ro
      - ${ZAZZZOR_BACKUP_DIR:?заполните ZAZZZOR_BACKUP_DIR в deploy/.env - каталог копий на хосте}:/backups
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/backup/backup-job.sh", "health"]
      interval: 10m
      timeout: 30s
      retries: 1
      start_period: 1m
      start_interval: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 45s

networks:
  # Only postgres and api: no route out, no ports, unreachable from other
  # containers on the host.
  db:
    internal: true
  # api only, for its port on 127.0.0.1 (an internal network cannot publish).
  api:

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  apidata:
