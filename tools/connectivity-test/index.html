<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zazzzor — Connectivity test</title>
    <style>
      body { font-family: system-ui, sans-serif; color: #1a1a1a; background: #fff; max-width: 52rem; margin: 0 auto; padding: 1rem; line-height: 1.5; }
      button { font: inherit; padding: 0.4rem 0.9rem; cursor: pointer; }
      button:disabled { cursor: default; }
      .banner { background: #fff3bf; border: 1px solid #e0b500; padding: 0.5rem 0.75rem; }
      .warn { color: #b00020; }
      .videos { display: flex; flex-direction: column; gap: 0.75rem; }
      .videos figure { margin: 0; }
      /* Full column width: the test must render (and decode) the full-size demo. */
      .demo { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; cursor: zoom-in; }
      table { border-collapse: collapse; }
      th { text-align: left; padding: 0.15rem 1rem 0.15rem 0; font-weight: 600; vertical-align: top; }
      pre { background: #f4f4f4; padding: 0.75rem; overflow-x: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
