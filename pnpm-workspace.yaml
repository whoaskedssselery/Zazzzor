packages:
  - "tools/*"
  - "web"
# unrs-resolver (under eslint-import-resolver-typescript) ships prebuilt
# bindings as optional dependencies; its postinstall is only a fallback
# downloader, so it does not run. protobufjs (under the noise suppression
# package, via onnxruntime-web, which the client does not load) only checks
# its own install in postinstall.
allowBuilds:
  protobufjs: false
  unrs-resolver: false
# Security fixes the lint plugins pin below (pnpm audit): handlebars via
# eslint-plugin-boundaries, minimatch via typescript-eslint. Drop them once
# the parents ship the fixed versions.
overrides:
  handlebars: 4.7.10
  "minimatch@>=7.0.0 <11.0.1": 11.0.1
# picomatch ReDoS (GHSA-fc5q-39xc-vjpf, published 2026-11-18) has no fixed
# release yet. picomatch is only in the build and lint tools (ESLint plugins,
# Vite, Vitest), never in what the browser or the server runs:
# `pnpm why picomatch --prod -r` finds nothing. Ignored by the owner's
# decision until a fixed picomatch ships; then drop this and override
# picomatch to the fixed version like the pins above.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
